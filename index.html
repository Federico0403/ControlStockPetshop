<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Stock - Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./Css/estilo.css">
  <link rel="icon" href="./Img/Logo.png">
</head>
<body>
  
  <nav class="navbar navbar-expand-lg nav-color">
    <div class="container-fluid">
      <a class="navbar-brand"><span id="blanco">CONSENTIDOS </l><span>Tienda de mascotas</span></a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" id="productos" >Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="agregarProductos">Agregar Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="proveedores">Proveedores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="agregarProveedores">Agregar Proveedores</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <div id="formularioAgregarProducto" class="formularioAgregar">
    <h3>Agregar Producto</h3>
    <form id="formAgregarProducto">
        <div class="form-row">
            <div class="form-group">
                <label for="nombreProducto">Nombre</label>
                <input type="text" id="nombreProducto" class="form-control" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="marcaProducto">Marca</label>
                <input type="text" id="marcaProducto" class="form-control" autocomplete="off" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="precioProducto">Precio</label>
                <input type="number" id="precioProducto" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="tipoProducto">Tipo</label>
                <input type="text" id="tipoProducto" class="form-control" autocomplete="off" required>
            </div>
        </div>
        <div class="form-group">
            <label for="descripcionProducto">Descripción</label>
            <textarea id="descripcionProducto" class="form-control" rows="3" required></textarea>
        </div>
        <div class="form-buttons">
            <button type="submit" class="botones">Guardar</button>
            <button type="button" id="cancelarAgregar" class="botones">Finalizar</button>
        </div>
    </form>
</div>

<div id="ventas" class="container mt-5">
  <h1>Ventas</h1>
  <div id="productosSeleccionados"></div>
</div>



<!-- Formulario para modificar producto (oculto inicialmente) -->
<div id="formularioModificar" class="formularioModificarr" style="display: none;">
  <h3>Modificar Producto</h3>
  <form id="formModificarProducto">
      <input type="hidden" id="idProductoModificar">
      <div class="form-group">
          <label for="modificar_nombreProducto">Nombre</label>
          <input type="text" id="modificar_nombreProducto" class="form-control" autocomplete="off">
      </div>
      <div class="form-group">
          <label for="modificar_marcaProducto">Marca</label>
          <input type="text" id="modificar_marcaProducto" class="form-control" autocomplete="off">
      </div>
      <div class="form-group">
          <label for="modificar_tipoProducto">Tipo</label>
          <input type="text" id="modificar_tipoProducto" class="form-control" autocomplete="off">
      </div>
      <div class="form-group">
          <label for="modificar_precioProducto">Precio</label>
          <input type="number" id="modificar_precioProducto" class="form-control">
      </div>
      <div class="form-group">
          <label for="modificar_descripcionProducto">Descripción</label>
          <input type="text" id="modificar_descripcionProducto" class="form-control" autocomplete="off">
      </div>
      <button type="submit" class="botones">Guardar Cambios</button>
      <button type="button" id="cancelarModificar" class="botones">Cancelar</button>
  </form>
</div>





  <div class="container mt-1 contenedor">
    <div id="filtrosMarca"></div>


    <div class="table-responsive" id="contenedorMostrar">
      <!-- Aquí se cargarán los productos, proveedores y movimientos -->
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./Js/stock.js"></script>
</body>
</html>
